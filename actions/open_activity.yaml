# yaml-language-server: $schema=../schemas/action-definition.schema.json
name: open_activity
title: Open a client activity
summary: >-
  Open one of the app's activities for a client — forms, retail execution, store check, audit,
  notes, photos, orders, invoices, collection, CLM, history, media — for the rep to complete.
since: 0.1.0
reports_result: false
description: |-
  Opens an activity for a client so the rep completes it in the app; the phone handles the
  visit, permissions and picking. Prefer it over open_screen for anything done for a client,
  and never tell the rep to go there themselves.
  - Client: during an open visit, leave it out — the visit's client is used, and naming another
    client fails. Otherwise send client_name (with client_name_variants), client_id or nearest;
    the client is matched as for start_visit, and the rep picks when several match.
  - A specific form or retail-execution template: put its name in form_name or template_name.
  - Visit: form, form_history, collection, reminders, clm, client_history, media and
    ai_sales_order open without a visit; sales_order too when the rep may order outside a visit.
    The rest need an open visit at the client — the card offers "Start visit & continue", and
    any start_visit check can stop it.
  - prefill opens the screen already filled for the rep to review and submit — use it whenever
    the rep tells you what to record in a form, a note or a reminder, so they never type it
    again. form (with form_name): {"<the question's key words as the rep said them> | <the same
    words in English, or in Arabic if the rep wrote English>": answer} — 1–4 words per side, not
    a full sentence; form questions are often saved in another language than the rep speaks.
    note: {"content": …}. reminders: {"name": …, "content": …, "from"?: …, "to"?: …} — opens a
    new reminder instead of the list. Numbers as numbers, yes/no as true/false, dates as
    YYYY-MM-DD, free text as text. Photos, signatures, scans and list picks stay with the rep.
  - An order, invoice or return WITH products is build_order, not this.
  The phone reports nothing back — not when the activity opens, not when it fails (a failure
  only shows on the card) — so tell the rep what they will see, not that it is done.

params:
  type: object
  additionalProperties: false
  required: [activity]
  properties:
    activity:
      type: string
      enum:
        - form
        - form_v1
        - form_history
        - retail_execution
        - store_check
        - audit
        - item_selection
        - shelf_scan
        - note
        - photo
        - before_after
        - sales_order
        - return_sales_order
        - invoice
        - cash_invoice
        - credit_invoice
        - collection
        - reminders
        - clm
        - client_history
        - media
        - ai_sales_order
      description: >-
        form: the client's forms (form_v1 only for classic forms; form_history: forms already
        filled). retail_execution, store_check, audit, item_selection, shelf_scan: the matching
        merchandising activity. note, photo, before_after: a note or photos. sales_order,
        return_sales_order, invoice, cash_invoice, credit_invoice: an empty document (use
        build_order when the rep names products). collection: the client's balance and payments.
        reminders, clm (presentations), client_history, media: the matching client screen.
        ai_sales_order: the suggested sales order.
    client_name: { $shared: client_name }
    client_name_variants: { $shared: client_name_variants }
    client_id: { $shared: client_id }
    nearest: { $shared: nearest }
    form_name:
      type: string
      minLength: 1
      description: The name of a specific form to open.
    template_name:
      type: string
      minLength: 1
      description: The name of a specific retail-execution template to open.
    prefill:
      type: object
      minProperties: 1
      maxProperties: 40
      description: >-
        Answers to place before the screen opens (form with form_name, note, reminders) — see
        the description for the keys. The card previews each answer and the rep confirms; answers
        that match no field are shown as not placed.
      additionalProperties:
        anyOf:
          - type: [string, number, boolean]
          - type: array
            items: { type: string }

# Shown on the card only — never reported back.
errors:
  - code: client_required
    description: No visit is open and no client was named.
  - code: client_not_found
    description: No client matched.
  - code: no_location
    description: "nearest: the phone has no GPS fix."
  - code: no_nearby_client
    description: "nearest: none of the rep's clients is nearby."
  - code: visit_open_for_other_client
    description: A visit is open at another client.
  - code: visit_required
    description: The activity needs an open visit at the client.
  - code: not_available
    description: The activity is off for the rep (module or permission).
  - code: form_not_found
    description: No form matched form_name.
  - code: template_not_found
    description: No retail-execution template matched template_name.
  - code: template_needs_sync
    description: The template isn't on the phone yet; the app has to sync first.
  - code: sales_screen_open
    description: A sales screen is already open in the app.
  - code: activity_screen_open
    description: Another activity screen is already open in the app.
  - code: order_in_progress
    description: An order is already in progress in the app.
  - code: error
    description: Something else went wrong.

examples:
  - says: I want to fill a form
    request:
      action: open_activity
      params: { activity: form }
      summary: Open the forms for the current visit
  - says: سجل التحصيل عند النور ماركت
    request:
      action: open_activity
      params:
        activity: collection
        client_name: النور ماركت
        client_name_variants: [Al Noor Market, Al Nour Market]
      summary: فتح التحصيل لعميل النور ماركت
  - says: Open the shelf audit form
    request:
      action: open_activity
      params: { activity: form, form_name: Shelf audit }
      summary: Open the "Shelf audit" form
  - says: "عبّئ نموذج Shelf audit: العصير متوفر، وملاحظة البلانوغرام: الرفوف مرتبة"
    request:
      action: open_activity
      params:
        activity: form
        form_name: Shelf audit
        prefill:
          "العصير | juice": true
          "البلانوغرام | planogram": الرفوف مرتبة
      summary: فتح نموذج Shelf audit معبّأً للمراجعة
  - says: Add a reminder to collect the payment from Al Noor Market on 2026-11-02
    request:
      action: open_activity
      params:
        activity: reminders
        client_name: Al Noor Market
        prefill: { name: Collect payment, content: Collect the overdue payment, from: "2026-11-02" }
      summary: New reminder for Al Noor Market

maintainer_notes:
  - >-
    Failures never reach the assistant (card only), so it can't help — form_not_found is the
    clearest case: it could offer the closest form names. Report failures back as failed results
    (successes can stay silent).
