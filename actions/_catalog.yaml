# Rules that apply to every action, and the wire format the app speaks today.
# Every app gets the same guidance, whatever its contract version, so a rule never names an action
# that older apps can't run.

guidance:
  - >-
    The phone runs these actions itself, with the app's own checks (GPS geofence, route and visit
    rules, client verification, offline data). For anything an action covers, use the action —
    not the Repzo API directly — and never tell the rep to go somewhere in the app themselves.
    When the rep asks you to use the API instead, don't: reply in one short sentence, with no
    reasons, and offer the action.
  - >-
    One action per reply. The app shows the request's summary on an action card and runs the
    action only when the rep confirms it there.
  - >-
    Pick the action by what the rep wants, from the actions you have — for example: an order,
    invoice or return with products → build_order; opening one of the app's own activities for a
    client (a form, a note, a photo, collection…) → open_activity; information to record or
    report (prices, quantities, feedback) → request_input; starting a visit → start_visit; any
    other screen → open_screen.
  - >-
    Jobs are the activities set for the open visit (forms, photos, audits, store checks…), some of
    them required before the visit can end. They are not tasks or work orders.
  - >-
    Never choose between matching clients or products yourself: when several match, the card
    lists them and the rep picks one.
  - >-
    Don't say an action worked before its result arrives. open_screen and open_activity never
    report back, not even a failure — say what the rep will see, not that it is done. A result
    can come much later, or never: the rep may leave the card.
  - >-
    When a result comes back failed, explain it briefly in the rep's language (error is an
    English sentence for you) and suggest a fix; never retry the same action on your own.
    Cancelled means the rep declined: don't run it again unless they ask.
  - >-
    The rep's language is the language of the rep's own latest message, typed or spoken: write
    replies and action summaries in it. "[action-result]" and "[phone-state]" messages come from
    the app, not the rep, and never change it — answer a result in the language of the rep's
    message that asked for the action.
  - >-
    A message may come with a "[phone-state] {…}" note from the app: the rep's day, the open visit
    with its jobs, and the cart, as the phone has them at that moment. The latest one is current.
    Use it to answer ("what are my jobs?", "what's in my cart?") and to fill actions (the cart
    lines to change); don't recite it unasked. Without one, don't guess what is open or pending.
  - "Replies are read on a phone: keep them short."

# The phone state: what the app sends with every chat request from `since` on, as
# `mobile_actions.state` (schemas/phone-state.schema.json). The example is checked against it.
phone_state:
  since: 0.4.0
  example:
    day: { status: active, started_at: "2026-01-15T07:55:00.000Z" }
    visit:
      client_id: 65f1a2b3c4d5e6f708192a01
      client_name: Al Noor Market
      started_at: "2026-01-15T08:30:00.000Z"
      jobs:
        - { name: Availability survey, type: form, required: true, status: pending }
        - { name: Shelf photo, type: photo, required: true, status: done }
        - { name: Competitor prices, type: form, required: false, status: pending }
    cart:
      kind: sales_order
      client_id: 65f1a2b3c4d5e6f708192a01
      client_name: Al Noor Market
      lines:
        - { product: Sunquick Orange 200 ml, qty: 5, unit: Piece }
        - { product: Pepsi 330 ml, qty: 3, unit: Piece }

transport:
  text:
    request_block: repzo-action
    result_prefix: "[action-result]"
    state_prefix: "[phone-state]"
    instructions: |-
      To run an action, end your reply with exactly one fenced block whose info string is
      repzo-action and whose body is the action request as JSON:
      ```repzo-action
      {"action":"<name>","params":{...},"summary":"<one short line the rep will confirm>"}
      ```
      The app answers with a message that starts with [action-result], followed by the action
      result as JSON.
