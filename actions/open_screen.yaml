# yaml-language-server: $schema=../schemas/action-definition.schema.json
name: open_screen
title: Open an app screen
summary: >-
  Open a screen of the mobile app — clients, calendar, tasks, reports, approvals, a client's
  profile, and more.
since: 0.1.0
reports_result: false
description: |-
  Opens a screen of the Repzo mobile app; a floating "back to assistant" button brings the rep
  back to the chat. For anything done for a specific client (a form, an order, a note, a photo,
  collection…) use open_activity instead. client_profile needs the client: send client_name and
  client_name_variants (matched as for start_visit; the rep picks when several match).
  The phone reports nothing back — not when the screen opens, not when it fails (a failure only
  shows on the card) — so tell the rep what they will see, not that it is done.

params:
  type: object
  additionalProperties: false
  required: [screen]
  properties:
    screen:
      type: string
      enum:
        - client_profile
        - clients
        - visit
        - sales
        - forms
        - tasks
        - calendar
        - reports
        - dashboards
        - timeline
        - approvals
        - settings
        - profile
      description: >-
        client_profile: one client's profile (needs client_name). clients: the rep's client
        list. visit: the current visit. sales: sales documents. forms: forms. tasks: tasks.
        calendar: the rep's schedule. reports, dashboards: the rep's reports and dashboards.
        timeline: the rep's activity timeline. approvals: approval requests. settings: app
        settings. profile: the rep's own profile.
    client_name: { $shared: client_name }
    client_name_variants: { $shared: client_name_variants }
  if:
    properties: { screen: { const: client_profile } }
  then:
    required: [client_name]

# Shown on the card only — never reported back.
errors:
  - code: client_not_found
    description: "client_profile: no client matched."
  - code: visit_open_for_other_client
    description: A visit is open at another client.
  - code: no_active_visit
    description: "visit: no visit is open."
  - code: not_available
    description: The screen is off for the rep (module or permission).
  - code: error
    description: Something else went wrong.

examples:
  - says: افتح التقويم
    request:
      action: open_screen
      params: { screen: calendar }
      summary: فتح التقويم
  - says: Open Al Noor Market's profile
    request:
      action: open_screen
      params:
        screen: client_profile
        client_name: Al Noor Market
        client_name_variants: [النور ماركت]
      summary: Open Al Noor Market's profile

maintainer_notes:
  - >-
    Failures never reach the assistant (card only), so it can't help — e.g. after
    client_not_found it can't ask for another spelling. Report failures back as failed results
    (successes can stay silent).
